name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-lock.txt

      - name: Run tests (mock/unit only)
        env:
          GIS_MODE: mock
        run: |
          python -m pytest -q

      - name: Run Node.js unit tests
        run: |
          node --test tests/*.test.cjs

      - name: Check JS syntax (all browser scripts)
        run: |
          for f in static/*.js; do node --check "$f"; done
          echo "all static/*.js syntax OK"

  # Browser smoke tests (tests/browser_*.py) need Playwright + Chromium and are
  # not run here: on the current main the admin-login step does not make
  # #workspace visible in headless Chromium, so the scenarios fail. They are
  # kept in tests/ for local repair and are NOT wired into CI until they pass.
  # See the audit report for details.
